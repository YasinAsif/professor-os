version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - faiss_data:/app/data/faiss_indexes
      - docling_cache:/app/data/docling_cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery Worker: Grading & XAI Fleet ──────────────
  celery_worker_grading:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app
      - faiss_data:/app/data/faiss_indexes
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker -Q grading_high,grading_normal,xai_queue,celery --concurrency=2 --loglevel=info -n worker_grading@%h

  # ── Celery Worker: RAG, Docling & Question Gen ──────
  celery_worker_ai:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - DOCLING_CACHE_DIR=/app/data/docling_cache
    volumes:
      - ./backend:/app
      - faiss_data:/app/data/faiss_indexes
      - docling_cache:/app/data/docling_cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker -Q rag_queue,question_gen_queue,reporting_queue --concurrency=2 --loglevel=info -n worker_ai@%h

volumes:
  postgres_data:
  redis_data:
  faiss_data:
  docling_cache:

